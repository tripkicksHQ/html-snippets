<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">
<title>modalHotelBanner2_AZ - Manchester</title>
<style>
body {
margin: 0 auto;
padding: 0;
background-color: #ffffff;
display: flex;
justify-content: center;
}
.preview-container {
width: 494px;
height: 600px;
overflow: hidden;
box-shadow: 0 0 0 1px #ccc;
}
.card {
position: relative;
}
</style>
</head>
<body>
<div class="preview-container">
<!-- ⬇ tkAustin content starts here -->
<div class="container-fluid m-0 p-0" style="max-width:100%; overflow-x:hidden; position:relative; border-top-right-radius:50px;">
<div class="container-fluid p-0" style="max-width:100%; overflow-x:hidden;">
<div class="row m-0">
<div class="card m-0 p-0" style="overflow:hidden; border-top-right-radius:50px; min-height:600px;">
<!-- Card Header with auto height matching the image -->
<div class="card-header" style="padding:0; margin:0; border-top-right-radius:50px;">
<img src="https://info.tripkicks.com/hubfs/ClientInsights/AstraZeneca/hotelBanners/manchester_4.4.25.png"
alt="Manchester Hotel Banner"
style="width:100%; height:auto; display:block;">
</div>
<!-- Card Body -->
<div style="background-color: #F5F7F7; flex:1;">
<div class="card-body m-0 mt-4 mb-4" style="z-index:0;">
<h5 class="card-title">Consider staying at the DoubleTree.</h5>
<p class="card-text" style="font-size:1.1rem;">This hotel is a recommended option considering:</p>
<ul class="list-styled" style="font-size:1.05rem; line-height:1.8;">
<li>It has the lowest CO2 emissions in the area due to their 'Travel with Purpose' program</li>
</ul>
<br>
</div>
</div>
<!-- Footer -->
<div class="footer d-flex align-items-center justify-content-between flex-nowrap"
style="background-color:#830051; height:60px; overflow:hidden; border-bottom-left-radius:6px; border-bottom-right-radius:6px;">
<img src="https://info.tripkicks.com/hubfs/ClientInsights/AstraZeneca/azSlogan.png"
alt="Footer Slogan"
style="height:100%; max-height:60px; max-width:70%; object-fit:contain; margin-left:8px;">
<div style="padding-right:20px;">
<img src="https://info.tripkicks.com/hubfs/ClientInsights/AstraZeneca/azLogoW.svg"
alt="AstraZeneca Logo"
style="max-height:25px; height:auto;">
</div>
</div>
</div>
</div>
</div>
</div>
<!-- ⬆ End of tkAustin content -->
</div>
</body>
</html>
